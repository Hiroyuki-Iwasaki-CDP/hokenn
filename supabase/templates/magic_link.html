<div style="max-width:480px;margin:0 auto;padding:32px 24px;font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;color:#14201d;">
  <p style="font-size:13px;font-weight:bold;letter-spacing:0.05em;color:#10635c;margin:0 0 8px;">わが家の保険</p>
  <h1 style="font-size:18px;margin:0 0 20px;">登録・ログインのご案内</h1>
  <p style="font-size:14px;line-height:1.7;margin:0 0 20px;">
    招待を受け取った方は、下のボタンから利用開始の登録へ進めます。
  </p>
  <p style="margin:0 0 22px;">
    <a href="{{ .RedirectTo }}" style="display:block;border-radius:12px;background:#10635c;padding:14px 20px;text-align:center;font-size:15px;font-weight:bold;color:#ffffff;text-decoration:none;">登録・ログインを続ける</a>
  </p>
  <p style="font-size:13px;line-height:1.7;color:#52534e;margin:0 0 12px;">
    通常のログインでは、ログイン画面に戻って以下の6桁コードを入力することもできます。
  </p>
  <div style="background:#f6f5f1;border-radius:12px;padding:20px;text-align:center;margin:0 0 20px;">
    <span style="font-size:36px;font-weight:bold;letter-spacing:0.2em;color:#12413d;">{{ .Token }}</span>
  </div>
  <p style="font-size:13px;line-height:1.7;color:#52534e;margin:0 0 20px;">
    ボタンと認証コードはいずれも一度使用すると再利用できません。心当たりのない場合は、このメールを破棄してください。
  </p>
  <p style="font-size:12px;color:#85837c;margin:0;">
    安全のため、保険証券画像・病歴・口座情報などの機密情報はご登録いただかないようお願いいたします。
  </p>
</div>
